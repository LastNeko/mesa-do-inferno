/* pergaminho: superfícies claras trocam a tinta */
.panel,.sheet{
  --sheet:#eadab7; --sheet2:#dfcaa1; --ink:#2b1b12; --ink2:#5c3f2c; --blood:#7a1010; --line:#a98761;
  --bile:#4b5714; --warn:#8a4f00; --gold:#7a5a0c; --shadow:rgba(60,30,10,.25);
  color-scheme:light; color:var(--ink);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:
    radial-gradient(ellipse 110% 60% at 50% -12%,rgba(150,22,14,.38),transparent 62%),
    radial-gradient(ellipse 70% 50% at 8% 92%,rgba(70,8,6,.6),transparent 70%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'640'%20height%3D'640'%3E%3Cfilter%20id%3D'v'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeTurbulence%20type%3D'turbulence'%20baseFrequency%3D'.012'%20numOctaves%3D'3'%20seed%3D'4'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.02%200%200%200%200%200%200%200%200%200%200%20-7%200%200%200%201'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23v)'%20opacity%3D'.5'%2F%3E%3C%2Fsvg%3E"),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'520'%20height%3D'520'%3E%3Cfilter%20id%3D'f'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.006%20.03'%20numOctaves%3D'4'%20seed%3D'11'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.42%200%200%200%200%20.05%200%200%200%200%20.04%200%200%200%20-1.4%20.95'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23f)'%2F%3E%3C%2Fsvg%3E"),
    linear-gradient(#1a0605,#0e0303);
  background-attachment:fixed;}
::selection{background:#8f1a12;color:#fbeedd}
/* vinheta que pulsa como um coração (lub-dub a cada 1,2 s) */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 52%,rgba(0,0,0,.82) 100%);
  animation:pulso 1.2s infinite}
@keyframes pulso{0%,100%{opacity:.72}10%{opacity:1}22%{opacity:.8}32%{opacity:.96}55%{opacity:.72}}
@media (hover:hover) and (pointer:fine){
  body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'28'%20height%3D'28'%20viewBox%3D'0%200%2028%2028'%3E%3Cg%20stroke%3D'%231a0404'%20stroke-width%3D'1.3'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M2%202c9%202%2017%208%2021%2019l-4.4%202.6C16.4%2014.6%2010.6%208%202%202z'%20fill%3D'%23eadcc2'%2F%3E%3Cpath%20d%3D'M7%209.5c5%203%208.6%207.2%2010.4%2013.2l-3.4%202C12.8%2018%2010.6%2013.4%207%209.5z'%20fill%3D'%23cbb592'%2F%3E%3C%2Fg%3E%3Cpath%20d%3D'M4.6%203.6c6.6%202.4%2012%207.6%2015.6%2016'%20fill%3D'none'%20stroke%3D'%23a3160d'%20stroke-width%3D'.9'%2F%3E%3C%2Fsvg%3E") 2 2,auto}
  button,select,label,input[type=checkbox],input[type=file]{cursor:pointer}
  input,textarea{cursor:text}
}
.wrap{max-width:1120px;margin:0 auto;position:relative;z-index:1}
header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0;border-bottom:2px solid #8f1a12;
  background:linear-gradient(#0d0303 0%,#1a0706 100%);box-shadow:0 12px 18px -12px rgba(0,0,0,.9)}
.hrow{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;justify-content:space-between}
.topo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:flex-end}
h1{position:relative;display:inline-block;font-family:var(--display);font-weight:900;color:#e8402b;font-size:clamp(25px,4.6vw,36px);margin:0 0 10px;letter-spacing:.03em;line-height:1.05;
  filter:url(#rasgo);text-shadow:0 2px 0 #3a0503,0 4px 10px rgba(0,0,0,.65)}
.escorre i{position:absolute;top:calc(100% - 7px);left:var(--x);width:var(--w,3px);height:var(--h);border-radius:0 0 2px 2px;
  background:linear-gradient(#b3170d,#6e0907);animation:escorre var(--d) var(--ease-inout) infinite alternate}
.escorre i::after{content:"";position:absolute;left:50%;bottom:-4px;width:calc(var(--w,3px) + 4px);height:calc(var(--w,3px) + 5px);transform:translateX(-50%);
  border-radius:50% 50% 50% 50%/42% 42% 58% 58%;background:#8a0f0a}
@keyframes escorre{from{height:calc(var(--h) * .45)}to{height:var(--h)}}
.who{font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who b{color:var(--ink)}
.tag{font-family:var(--display);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--blood);color:var(--blood)}
.tag.m{background:#8f1a12;border-color:#8f1a12;color:var(--blood-ink)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:12.5px;text-transform:uppercase;border:1px solid #4a2219;border-bottom:0;
  background:linear-gradient(#2a100d,#1b0806);color:#cfb08e;padding:9px 12px;white-space:nowrap;position:relative}
.tabs button:hover:not(:disabled){color:#f3dfc3;border-color:#7a2a1d}
.tabs button[aria-selected=true],.tabs button[aria-selected=true]:hover{color:#fff1e2;border-color:#8f1a12;
  background:radial-gradient(ellipse 60% 50% at 30% 20%,rgba(255,170,150,.16),transparent 70%),linear-gradient(170deg,#a3231a,#6a0d09)}
.tabs .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:#ff5a3c;box-shadow:0 1px 2px rgba(0,0,0,.7)}
/* gotas escorrendo da linha de sangue do cabeçalho */
.gotas{position:absolute;left:0;right:0;top:100%;height:0;pointer-events:none}
.gota{position:absolute;top:-1px;left:var(--x);width:9px;height:34px;transform-origin:top;opacity:0;animation:gota var(--d) var(--w) infinite}
@keyframes gota{0%{transform:scaleY(0);opacity:0}4%{opacity:1}55%{transform:scaleY(1);opacity:1;animation-timing-function:cubic-bezier(.55,0,1,.45)}
  78%{transform:translateY(14px) scaleY(1.12);opacity:0}100%{transform:translateY(14px) scaleY(1.12);opacity:0}}
main{padding-top:30px}
h2{font-family:var(--display);font-weight:700;color:var(--blood);font-size:17px;margin:0 0 8px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:var(--body);font-weight:400;font-size:13.5px;color:var(--ink2);letter-spacing:0}
h3{font-family:var(--display);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blood);margin:12px 0 6px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--sheet);border:1px solid var(--line);padding:5px 10px;
  transition:transform .12s var(--ease-out),border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--blood);color:var(--blood)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
/* botão principal: carne crua, com brilho úmido no hover */
button.primary{position:relative;overflow:hidden;color:#fff1e2;border:1px solid #4a0705;font-family:var(--display);font-weight:700;letter-spacing:.6px;font-size:13px;
  background:
    radial-gradient(ellipse 70% 35% at 28% 22%,rgba(255,190,170,.22),transparent 70%),
    radial-gradient(ellipse 18% 70% at 64% 60%,rgba(255,215,195,.12),transparent 70%),

@keyframes tremor{0%{transform:translate(.6px,0)}33%{transform:translate(-.6px,.5px)}66%{transform:translate(.3px,-.5px)}100%{transform:translate(0,0)}}
.shead{display:grid;grid-template-columns:120px 1fr;gap:14px;border-bottom:2px solid var(--blood);padding-bottom:12px;margin-bottom:12px}
@media (max-width:520px){.shead{grid-template-columns:84px 1fr}}
.foto{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--sheet2);border:1px solid var(--line);display:block;box-shadow:0 3px 8px rgba(40,10,4,.35)}
.fotoph{width:100%;aspect-ratio:3/4;background:var(--sheet2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink2);font-size:12px;font-family:var(--display);letter-spacing:1px}
.sname{font-family:var(--display);font-weight:900;font-size:clamp(20px,3.6vw,28px);color:var(--blood);border:0;border-bottom:1px solid var(--line);background:transparent!important;width:100%;padding:0 2px}
.fl{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
.line{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent!important;padding:2px}
.box{border:1.5px solid var(--blood);background:rgba(223,202,161,.7);padding:10px 12px;min-width:0}
.box h3{margin-top:0;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.box h3 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink2);font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.sgrid{grid-template-columns:1fr}}
.mt{margin-top:12px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--sheet)}
.step button{border:0;width:28px;height:28px;padding:0;font-weight:700;background:transparent}
.step output{min-width:26px;text-align:center;font-family:var(--display);font-weight:700}
.attrs{width:100%;border-collapse:collapse}
.attrs td{padding:5px 4px;border-bottom:1px dotted var(--line);vertical-align:middle}
.attrs .an{font-weight:600}.attrs .an small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px}
.attrs .ch{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.attrs .ch small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--ink2)}
.pips{display:flex;gap:4px}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--blood);background:transparent;padding:0}
.pip.on{background:radial-gradient(circle at 35% 30%,#c4392a,#7a1010 70%)}
.pips.off .pip{border-color:var(--line)}
.rb{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.rb button{padding:3px 8px;font-size:14px}
@media (max-width:560px){.attrs .hidesm{display:none}}
.difs{display:flex;flex-wrap:wrap;gap:4px}
.difs button[aria-pressed=true]{background:linear-gradient(170deg,#9b2219,#6a0d09);color:#fff1e2;border-color:#6a0d09}
.result{position:relative;isolation:isolate;min-height:52px;margin-top:8px;padding:8px 10px;border:1px dashed var(--line);background:var(--sheet)}
.result .big{font-family:var(--display);font-size:28px;margin-right:8px;font-variant-numeric:tabular-nums}
/* falha crítica: respingo atrás do resultado; excepcional: ouro manchado */
.result:has(.r-crit){border:1px solid #7a1010;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20120%20120'%3E%3Cg%20fill%3D'%23a3160d'%20fill-opacity%3D'.3'%3E%20%3Cpath%20d%3D'M58%2044c6-3%209%204%2015%202s11-6%2013%200-6%208-3%2013%209%205%206%2010-9%201-12%205-1%2011-7%2011-5-7-10-8-11%204-13-1%205-8%203-13-8-7-4-11%209%200%2012-3z'%2F%3E%20%3Cpath%20d%3D'M86%2054l20-7-17%2011zM44%2080l-17%2015%2012-18zM70%2040l6-22%201%2023zM46%2052l-24-9%2023%204z'%2F%3E%20%3Ccircle%20cx%3D'92'%20cy%3D'28'%20r%3D'4'%2F%3E%3Ccircle%20cx%3D'101'%20cy%3D'47'%20r%3D'2.4'%2F%3E%3Ccircle%20cx%3D'29'%20cy%3D'36'%20r%3D'3'%2F%3E%3Ccircle%20cx%3D'21'%20cy%3D'70'%20r%3D'2'%2F%3E%3Ccircle%20cx%3D'86'%20cy%3D'92'%20r%3D'3.6'%2F%3E%3Ccircle%20cx%3D'50'%20cy%3D'99'%20r%3D'2'%2F%3E%3Ccircle%20cx%3D'105'%20cy%3D'77'%20r%3D'1.6'%2F%3E%3Ccircle%20cx%3D'41'%20cy%3D'19'%20r%3D'1.8'%2F%3E%3Ccircle%20cx%3D'76'%20cy%3D'12'%20r%3D'1.3'%2F%3E%3Ccircle%20cx%3D'14'%20cy%3D'52'%20r%3D'1.2'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") left -6px center/110px no-repeat,var(--sheet)}
.result:has(.r-exc){border:1px solid #9a7a1c;background:radial-gradient(ellipse 60% 90% at 12% 50%,rgba(205,160,45,.32),transparent 70%),radial-gradient(circle at 90% 80%,rgba(120,16,10,.18),transparent 30%),var(--sheet);
  box-shadow:inset 0 0 18px rgba(175,130,30,.35)}
.vida{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-variant-numeric:tabular-nums}
.vida b{font-size:30px;color:var(--blood)}
.bar{position:relative;height:9px;background:rgba(60,20,10,.18);border:1px solid var(--line);margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(#d33a28,#8f1a12 60%,#6a0d09);box-shadow:inset 0 1px 0 rgba(255,190,170,.35);transition:width .3s var(--ease-out)}
/* Vida perdida escorre para baixo antes de sumir */
.sangra{position:absolute;top:0;height:100%;pointer-events:none;background:#b3170d;border-radius:0 0 45% 45%/0 0 100% 100%;transform-origin:top;
  animation:sangra .85s cubic-bezier(.55,0,1,.45) forwards}
@keyframes sangra{0%{transform:none;opacity:1}30%{transform:scaleY(1.7);opacity:1}100%{transform:translateY(18px) scaleY(3.4);opacity:0}}
.tor{display:flex;gap:6px;margin:4px 0}
.tor .pip{width:20px;height:20px}
.tnote{font-size:14px;color:var(--ink2)}.tnote.hot{color:var(--blood);font-weight:700}
.mem{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.mem span{font-family:var(--display);color:var(--blood);font-weight:700;width:12px;padding-top:6px}
.mem textarea{flex:1;min-height:44px}
.mem.lost textarea{text-decoration:line-through;text-decoration-color:#7a1010;color:var(--ink2)}
.mem label{font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-top:8px}
.fer{list-style:none;margin:0;padding:0}
.fer li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line);font-size:15px}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.coin{text-align:center;border:1px solid var(--line);background:var(--sheet);padding:6px 4px}
.coin::before{content:"";display:block;width:22px;height:22px;margin:0 auto 2px;background:var(--blood);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.coin:has([data-n="carne"]){--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20d%3D'M3.5%2011.5C3.5%206.8%207.2%204%2011.6%204c4.3%200%207.6%202.6%207.6%206.2%200%202.6-1.9%204.6-4.6%205.6-2.4.9-3.4%202.9-6%202.9-3.2%200-5.1-3-5.1-7.2zm14.3%205.2l1.9%201.9a1.9%201.9%200%201%201%201.4%202.8%201.9%201.9%200%201%201-2.8-1.4l-1.8-1.8z'%2F%3E%3C%2Fsvg%3E")}
.coin:has([data-n="dentes"]){--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20d%3D'M6.2%203c2-1%203.9%200%205.8%200s3.8-1%205.8%200c2.9%201.4%202.9%206%201%209-1%201.7-1.2%204.8-2%207.9-.4%201.5-2%201.5-2.4%200l-1.4-5.4c-.3-1-1.7-1-2%200l-1.4%205.4c-.4%201.5-2%201.5-2.4%200-.8-3.1-1-6.2-2-7.9-1.9-3-1.9-7.6%201-9z'%2F%3E%3C%2Fsvg%3E")}
.coin:has([data-n="ossos"]){--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20d%3D'M7.3%202.6a2.6%202.6%200%200%200-4.5%202.3%202.6%202.6%200%200%200%202.4%204.3l9.6%209.6a2.6%202.6%200%200%200%204.3%202.4%202.6%202.6%200%200%200%202.3-4.5%202.6%202.6%200%200%200-3.4-3.5L8.8%206a2.6%202.6%200%200%200-1.5-3.4z'%2F%3E%3C%2Fsvg%3E")}
.coin small{display:block;font-size:12px;color:var(--ink2)}
.coin input{width:64px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;border:0;border-bottom:1px solid var(--line);background:transparent!important;font-variant-numeric:tabular-nums}
.ro input,.ro textarea,.ro select{pointer-events:none;border-style:dotted}
.ro .edit{display:none!important}

/* combate */
.comb{list-style:none;margin:0;padding:0}
.comb li{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:8px;border:1px solid var(--line);background:rgba(244,233,208,.75);margin-bottom:6px}
.comb li.cur{border-color:var(--blood);box-shadow:inset 4px 0 0 var(--blood),0 2px 8px rgba(80,10,5,.25)}
.comb li.hid{border-style:dashed}
.comb li.dead{background:#2b2725 url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20140%2070'%3E%3Cg%20fill%3D'none'%20stroke%3D'%23e2d8cb'%20stroke-opacity%3D'.4'%20stroke-width%3D'1.3'%20stroke-linejoin%3D'bevel'%3E%3Cpath%20d%3D'M140%206L116%2018l7%208-20%2011%205%209-19%2013%204%2011'%2F%3E%3Cpath%20d%3D'M103%2037l-14-4-9%207'%2F%3E%3Cpath%20d%3D'M123%2026l9%2014'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") right 40px center/150px auto no-repeat;border-color:#4a4440;color:#d3cac0}
.comb li.dead .cn{text-decoration:line-through;text-decoration-color:#c0180d;text-decoration-thickness:3px}
.comb li.dead .cn small,.comb li.dead .st,.comb li.dead .atk,.comb li.dead .ord{color:#b3aaa0}
.comb li.dead .bar{background:rgba(0,0,0,.3);border-color:#5a534e}
.comb .ord{font-family:var(--display);font-weight:700;color:var(--blood);text-align:center}
.comb .cn{font-weight:700}.comb .cn small{font-weight:400;color:var(--ink2)}
.comb .st{font-family:var(--display);font-size:13px;letter-spacing:.5px;text-align:right;font-variant-numeric:tabular-nums}
.comb .ctl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.comb .ctl input{width:58px;padding:2px 6px}
.atk{font-size:13.5px;color:var(--ink2);grid-column:2/-1}
.atk button{font-size:13px;padding:1px 7px;margin:2px 4px 2px 0}
.rodada{font-family:var(--display);font-size:22px;color:var(--blood)}
.ic-olho{display:inline-block;width:15px;height:15px;margin-right:4px;vertical-align:-2px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20fill-rule%3D'evenodd'%20d%3D'M1%2012c3-5%206.8-7.4%2011-7.4S20%207%2023%2012c-3%205-6.8%207.4-11%207.4S4%2017%201%2012zm11-4.3a4.3%204.3%200%201%200%200%208.6%204.3%204.3%200%200%200%200-8.6zm0%202.4a1.9%201.9%200%201%201%200%203.8%201.9%201.9%200%200%201%200-3.8z'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20fill-rule%3D'evenodd'%20d%3D'M1%2012c3-5%206.8-7.4%2011-7.4S20%207%2023%2012c-3%205-6.8%207.4-11%207.4S4%2017%201%2012zm11-4.3a4.3%204.3%200%201%200%200%208.6%204.3%204.3%200%200%200%200-8.6zm0%202.4a1.9%201.9%200%201%201%200%203.8%201.9%201.9%200%200%201%200-3.8z'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}

/* loja */
.items{width:100%;border-collapse:collapse}
.items td,.items th{padding:6px 4px;border-bottom:1px dotted var(--line);text-align:left;vertical-align:top}
.items th{font-family:var(--display);font-size:11.5px;letter-spacing:1px;color:var(--ink2);text-transform:uppercase}
.items .pr{white-space:nowrap;font-weight:600}
.items small{color:var(--ink2)}

/* pistas */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:radial-gradient(circle at 92% 8%,rgba(110,18,10,.22),transparent 18%),url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'260'%20height%3D'260'%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.85'%20numOctaves%3D'2'%20seed%3D'2'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.32%200%200%200%200%20.18%200%200%200%200%20.06%200%200%200%20.55%20-.18'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23g)'%2F%3E%3C%2Fsvg%3E"),#efe2b8;color:#2b1b12;border:1px solid #b89c62;padding:12px 12px 10px;
  box-shadow:2px 6px 14px rgba(0,0,0,.5);position:relative;transform:rotate(var(--r,0deg))}
.card:before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4392a,#6a0d09);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.card b{font-family:var(--display);display:block;margin-bottom:4px}
.card p{margin:0 0 6px;white-space:pre-wrap;font-size:15px}
.card .notas{border-top:1px dashed #a98761;padding-top:4px;font-size:14px}
.card .notas div{margin:3px 0}
.card .notas i{color:#6b4a33}
.card input{width:100%;background:#f6ecd0;color:#2b1b12;border-color:#b89c62;font-size:14px}
.card button{background:#f6ecd0;color:#2b1b12;border-color:#b89c62}
.card button:hover:not(:disabled){color:#7a1010;border-color:#7a1010}

/* diário */
.entry{border-left:3px solid #8f1a12;padding:4px 0 4px 12px;margin-bottom:16px}
.entry b{font-family:var(--display);color:var(--blood)}
.entry p{margin:4px 0 0;white-space:pre-wrap}
.entry small{color:var(--ink2)}

/* sussurros */
.msg{position:relative;background:linear-gradient(#120606,#0b0303);color:#ecd8bb;border:1px solid #5e3a2a;padding:10px 40px 10px 12px;margin-bottom:8px;font-style:italic;white-space:pre-wrap;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.msg::before{content:"";position:absolute;right:12px;top:11px;width:18px;height:18px;background:#a3160d;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20fill-rule%3D'evenodd'%20d%3D'M1%2012c3-5%206.8-7.4%2011-7.4S20%207%2023%2012c-3%205-6.8%207.4-11%207.4S4%2017%201%2012zm11-4.3a4.3%204.3%200%201%200%200%208.6%204.3%204.3%200%200%200%200-8.6zm0%202.4a1.9%201.9%200%201%201%200%203.8%201.9%201.9%200%200%201%200-3.8z'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%3E%3Cpath%20fill-rule%3D'evenodd'%20d%3D'M1%2012c3-5%206.8-7.4%2011-7.4S20%207%2023%2012c-3%205-6.8%207.4-11%207.4S4%2017%201%2012zm11-4.3a4.3%204.3%200%201%200%200%208.6%204.3%204.3%200%200%200%200-8.6zm0%202.4a1.9%201.9%200%201%201%200%203.8%201.9%201.9%200%200%201%200-3.8z'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.msg small{display:block;font-style:normal;color:#b39070;font-size:12px;margin-top:4px;text-shadow:none}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff1e2;padding:10px 16px;font-family:var(--display);font-size:14px;letter-spacing:.5px;z-index:70;
  background:linear-gradient(160deg,#9b2219,#5a0907);border:1px solid #3a0503;box-shadow:0 8px 22px rgba(0,0,0,.6);max-width:calc(100% - 32px)}
.gate{max-width:560px;margin:30px auto;text-align:center}
.mbtn{font-size:13px;padding:2px 8px}
#som[aria-pressed=true]{border-color:#8f1a12;color:#fbeedd;background:#3a0b08}
.mlogin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px}
.mlogin input{width:180px}
.mlogin .err{color:var(--blood);font-size:14px;width:100%;text-align:right}
.gate .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;text-align:left}

/* mapas */
.mapas{padding-top:22px}
.mp-barra{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.mp-trilha{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-family:var(--display);font-size:13px;color:var(--ink2)}
.mp-tr{background:transparent;border:0;color:var(--ink);font-family:var(--display);letter-spacing:.5px;padding:8px 4px;min-height:40px;text-decoration:underline;text-decoration-color:#8f1a12;text-underline-offset:4px}
.mp-tr-at{color:var(--blood);font-weight:700}
.mp-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mp-zoom{display:inline-flex}
.mp-zoom button{min-width:44px;min-height:40px;font-family:var(--display)}
.mp-corpo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:860px){.mp-corpo{grid-template-columns:1fr}}
.mp-palco{position:relative;height:min(74vh,760px);min-height:340px;background:#070303;border:1.5px solid #8f1a12;box-shadow:0 10px 26px rgba(0,0,0,.6);overflow:hidden}
@media (max-width:860px){.mp-palco{height:62vh}}
#mp-tela{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#mp-tela:active{cursor:grabbing}
.mp-gerando{display:none;position:absolute;inset:auto 0 12px 0;text-align:center;font-family:var(--display);color:#efdfc4;letter-spacing:1px}
.mp-palco.gerando .mp-gerando{display:block}
.mp-lado{max-height:min(74vh,760px);overflow:auto}
@media (max-width:860px){.mp-lado{max-height:none}}
.mp-lema{font-style:italic;color:var(--blood);margin:0 0 6px}
.mp-lista{list-style:none;margin:6px 0 0;padding:0}
.mp-lista li{margin:0 0 4px}
.mp-item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;min-height:44px;padding:6px 10px}
.mp-item b{font-family:var(--display);font-size:13.5px}
.mp-item small{margin-left:auto;color:var(--ink2);font-size:12.5px}
.mp-item.on{border-color:var(--blood);box-shadow:inset 0 0 0 1px var(--blood)}
.mp-item:disabled{opacity:.55}
.mp-n{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:#8f1a12;color:#fbeedd;font-family:var(--display);font-weight:900;font-size:13px}
.mp-fer{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.mp-fer button{min-height:40px}
.mp-fer button[aria-pressed=true],.mapas button.sm[aria-pressed=true]{background:linear-gradient(170deg,#9b2219,#6a0d09);color:#fff1e2;border-color:#6a0d09}
.mp-sel{border:1.5px solid var(--blood);background:rgba(223,202,161,.6);padding:8px 10px;margin:10px 0}
.mp-sel h3{margin-top:0}
.mp-sel textarea{margin:4px 0 8px}
.mp-ini select{flex:1 1 150px}
.mapas .row{margin:6px 0}

/* reações do jogo */
#fx-flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
#fx-flash.forte{background:radial-gradient(ellipse at center,rgba(210,25,12,.28),rgba(130,0,0,.7));animation:clarao .5s ease-out}
#fx-flash.leve{background:radial-gradient(ellipse at center,transparent 38%,rgba(180,10,5,.4));animation:clarao .45s ease-out}
#fx-flash.ouro{background:radial-gradient(ellipse at center,transparent 34%,rgba(200,150,35,.3));animation:clarao .8s ease-out}
@keyframes clarao{from{opacity:1}to{opacity:0}}
.wrap.treme{animation:treme .3s linear}
@keyframes treme{0%,100%{transform:none}14%{transform:translate(-7px,2px)}28%{transform:translate(6px,-3px)}42%{transform:translate(-5px,3px)}57%{transform:translate(4px,-2px)}71%{transform:translate(-3px,1px)}85%{transform:translate(2px,0)}}
#fx-suss{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(ellipse at center,rgba(14,3,3,.9),rgba(0,0,0,.97));animation:escurece .4s var(--ease-out);transition:opacity .45s}
#fx-suss.sai{opacity:0}
#fx-suss p{max-width:30ch;margin:0;font-style:italic;font-size:clamp(22px,4.6vw,32px);line-height:1.35;color:#e8573f;white-space:pre-wrap;
  text-shadow:0 1px 0 #4a0604,0 3px 10px rgba(0,0,0,.7)}
#fx-suss p span{animation:escreve .9s var(--ease-out) both}
#fx-suss small{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));color:#b39070;font-size:13px;font-family:var(--display);letter-spacing:1px}
@keyframes escurece{from{opacity:0}}
@keyframes escreve{from{opacity:0;filter:blur(5px);color:#ff8a66}50%{opacity:1;color:#ff4a30}to{opacity:1;filter:blur(0);color:#e8573f}}

@media (prefers-reduced-motion:reduce){
  body::before,.escorre i,.sheet[data-tor="5"],.feed li.new,.flash{animation:none}
  .gota{animation:none;opacity:.9;transform:scaleY(.55)}
  .cena.flash::before,.cena.flash .ct::before{display:none}
  .sangra{display:none}
  #fx-suss,#fx-suss p span{animation:none}
  button.primary::after{transition:none}
  button,.bar i{transition:none}
}

<script>
// ---------- efeitos visuais e sonoros: só decoração, não mexem em dados ----------
const FX=(()=>{
  const q=id=>document.getElementById(id);
  const calmo=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  let som=false; try{som=localStorage.getItem('mesa-som')==='1';}catch(e){}
  let ac=null;
  const audio=()=>{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}if(ac.state==='suspended')ac.resume();return ac;};
  const ruido=(a,dur)=>{const b=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s;};
  const env=(g,t,pico,ataque,queda)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pico,t+ataque);g.gain.exponentialRampToValueAtTime(.0001,t+ataque+queda);};
  const sons={
    coracao(a){[0,.27].forEach((dt,i)=>{const t=a.currentTime+dt,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(i?60:74,t);o.frequency.exponentialRampToValueAtTime(36,t+.17);env(g,t,i?.55:.85,.012,.24);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.3);});},
    squelch(a){const t=a.currentTime,n=ruido(a,.34),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.Q.value=7;f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(240,t+.3);env(g,t,.7,.01,.3);n.connect(f).connect(g).connect(a.destination);n.start(t);
      const o=a.createOscillator(),g2=a.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+.2);env(g2,t,.35,.01,.2);o.connect(g2).connect(a.destination);o.start(t);o.stop(t+.25);},
    sussurro(a){const t=a.currentTime,n=ruido(a,2),f=a.createBiquadFilter(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();f.type='bandpass';f.Q.value=2.4;f.frequency.value=480;l.frequency.value=3.1;lg.gain.value=200;
      l.connect(lg).connect(f.frequency);env(g,t,.4,.5,1.35);n.connect(f).connect(g).connect(a.destination);n.start(t);l.start(t);l.stop(t+2);}
  };
  const tocar=k=>{if(!som)return;try{const a=audio();if(a)sons[k](a);}catch(e){}};
  function botaoSom(){const b=q('som');if(!b)return;b.setAttribute('aria-pressed',som);b.textContent='Sons: '+(som?'ligado':'desligado');}
  document.addEventListener('click',ev=>{
    if(ev.target.closest('#som')){som=!som;try{localStorage.setItem('mesa-som',som?'1':'0');}catch(e){}botaoSom();if(som)tocar('coracao');return;}
    if(ev.target.closest('#fx-suss'))fechaSuss();
  });
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!q('fx-suss').hidden)fechaSuss();});
  function clarao(tipo){const f=q('fx-flash');f.className='';void f.offsetWidth;f.className=tipo;}
  function treme(){const w=document.querySelector('.wrap');w.classList.remove('treme');void w.offsetWidth;w.classList.add('treme');setTimeout(()=>w.classList.remove('treme'),320);}
  function roll(r){
    if(r.res==='crit'){if(!calmo()){treme();clarao('forte');}tocar('coracao');}
    else if(r.res==='exc'&&!calmo())clarao('ouro');
  }
  // compara a Vida mostrada agora com a última vista: se caiu, a parte perdida escorre
  const vidas=new Map();
  function after(){
    let dano=false;
    document.querySelectorAll('[data-hp]').forEach(el=>{
      const k=el.dataset.hp,v=+el.dataset.v,old=vidas.get(k);vidas.set(k,v);
      if(old!==undefined&&v<old-.001){dano=true;
        if(!calmo()){const b=document.createElement('b');b.className='sangra';b.style.left=(v*100)+'%';b.style.width=((old-v)*100)+'%';el.appendChild(b);b.addEventListener('animationend',()=>b.remove());}}
    });
    if(dano){if(!calmo())clarao('leve');tocar('squelch');}
  }
  let tS;
  function sussurro(txt){
    const o=q('fx-suss'),p=o.querySelector('p');p.textContent='';
    const cs=[...String(txt||'')];const passo=Math.min(45,2600/Math.max(1,cs.length));
    if(calmo())p.textContent=txt;
    else cs.forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(380+i*passo)+'ms';p.appendChild(s);});
    o.classList.remove('sai');o.hidden=false;tocar('sussurro');
    clearTimeout(tS);tS=setTimeout(fechaSuss,4800+cs.length*passo);
  }
  function fechaSuss(){const o=q('fx-suss');if(o.hidden)return;clearTimeout(tS);o.classList.add('sai');setTimeout(()=>{o.hidden=true;o.classList.remove('sai');},460);}
  botaoSom();
  return {roll,after,sussurro};
})();
</script>

,"armadura":0,"fome":0,"tormento":0,"fissuras":"","ferimentos":[],"feiticos":"","equip":"Trapos\nArma improvisada (1d4)","carne":0,"dentes":0,"ossos":0},"augusto":{"nome":"Augusto Valmont","jogador":"","vidaPassada":"Herdeiro e depois presidente de uma construtora familiar, rico e vaidoso. Achava que dinheiro era prova de mérito e nunca olhou para quem dormia nas calçadas.","morte":"Morreu de fome numa noite de inverno, na calçada, perto do restaurante onde um dia deixava gorjetas maiores que o pão de uma semana.","aparencia":"","foto":"","nivel":1,"memorias":[{"t":"O jantar da vitória: o brinde ao maior contrato da empresa, cercado de gente que depois não atendeu quando precisei.","lost":false},{"t":"A mão do meu pai na obra do primeiro prédio: “nunca esqueça de quem levantou cada parede”. Eu esqueci.","lost":false},{"t":"O pão quente que um padeiro me deu na rua, sem pedir nada em troca.","lost":false}],"pts":{"vida":0,"cac":0,"agi":0,"vig":0,"per":0,"sab":0,"mag":0,"men":0},"bonus":{"cac":3,"agi":3,"vig":3,"per":3,"sab":3,"mag":3,"men":3},"vidaAtual":20,"armadura":0,"fome":0,"tormento":0,"fissuras":"","ferimentos":[],"feiticos":"","equip":"Trapos\nArma improvisada (1d4)","carne":0,"dentes":0,"ossos":0},"clifford":{"nome":"Clifford Amos Calder","jogador":"","vidaPassada":"Psicólogo do luto que colecionava segredos. Fundou a Linden House, onde guardava as cartas de culpa dos pacientes e os empurrava cada vez mais fundo nela. Deixou o próprio filho se afogar e convenceu a esposa de que a culpa era dela.","morte":"Aos 59 anos, depois de um derrame, passou onze dias preso no próprio corpo, consciente e mudo, sem nenhuma visita, ouvindo segredos que já não valiam nada.","aparencia":"","foto":"","nivel":1,"memorias":[{"t":"O banquinho ao lado da mesa telefônica da minha mãe: “Nós nunca contamos, Clifford. Nós só lembramos.”","lost":false},{"t":"O envelope “Para Clifford” que ela deixou antes de entrar no lago congelado. Queimei no fogão sem abrir.","lost":false},{"t":"A rede balançando ao sol enquanto Daniel afundava no lago, e os quarenta segundos em que eu não me levantei.","lost":false}],"pts":{"vida":0,"cac":0,"agi":0,"vig":0,"per":0,"sab":0,"mag":0,"men":0},"bonus":{"cac":3,"agi":3,"vig":3,"per":3,"sab":3,"mag":3,"men":3},"vidaAtual":20,"armadura":0,"fome":0,"tormento":0,"fissuras":"","ferimentos":[],"feiticos":"","equip":"Trapos\nArma improvisada (1d4)","carne":0,"dentes":0,"ossos":0},"thomas":{"nome":"Thomas Hollow","jogador":"","vidaPassada":"Carpinteiro bondoso que construía casas para quem precisava e consertava móveis de graça. Vivia pelo filho, Noah, assassinado diante dele por criminosos atrás de um dinheiro que ele nunca teve.","morte":"Caçou por meses os assassinos do filho e morreu no confronto em que acabou com todos eles.","aparencia":"","foto":"","nivel":1,"memorias":[{"t":"O primeiro “pai” de Noah, correndo pelo quintal até os meus braços.","lost":false},{"t":"A cabana na árvore que construí para nós dois: “o lugar mais seguro do mundo”.","lost":false},{"t":"O aniversário de dez anos, com presentes feitos à mão: “Você é o melhor pai do mundo.”","lost":false}],"pts":{"vida":0,"cac":0,"agi":0,"vig":0,"per":0,"sab":0,"mag":0,"men":0},"bonus":{"cac":3,"agi":3,"vig":3,"per":3,"sab":3,"mag":3,"men":3},"vidaAtual":20,"armadura":0,"fome":0,"tormento":0,"fissuras":"","ferimentos":[],"feiticos":"","equip":"O Martelo de Hollow (1d6). O martelo com que ele construía casas; ninguém sabe como atravessou a morte com ele.\n• Ofício: construir, consertar, barricar portas ou montar armadilhas é Fácil (+25).\n• Juramento: quando um aliado ao lado cai a 0 de Vida, ganha 1 Bônus de Corpo a Corpo até o fim da cena (mesmo sem 3 pontos). Preço: +1 Tormento no fim da cena.\nTrapos","carne":0,"dentes":0,"ossos":0}}</script>
<script>
(()=>{
'use strict';
const DATA=JSON.parse(document.getElementById('dados').textContent);
const SLUGS=['dante','augusto','clifford','thomas'];
const ATTRS=[
  {k:'vida',n:'Vida',d:'cada ponto dá +6 de Vida',roll:false},
  {k:'cac',n:'Corpo a Corpo',d:'lutar, agarrar'},
  {k:'agi',n:'Agilidade',d:'esquivar, fugir, atirar'},
  {k:'vig',n:'Vigor',d:'veneno, dor, cansaço'},
  {k:'per',n:'Percepção',d:'emboscadas, ilusões'},
  {k:'sab',n:'Saber',d:'criaturas, medicina'},
  {k:'mag',n:'Magia',d:'aprender e conjurar'},
  {k:'men',n:'Resistência Mental',d:'medo, controle, loucura'}];
const DIFS=[['Fácil',25],['Normal',0],['Difícil',-20],['Extrema',-40]];
const FERS=['Corte fundo: perde 1 de Vida por rodada até ser tratado','Osso quebrado: −20 para lutar e se mover até curar','Pancada na cabeça: −20 em Percepção, Saber e Magia','Olho arrancado: −20 em Percepção e para atirar','Mão ou braço perdido','Perna perdida: anda pela metade, −20 em Agilidade'];
const TABS=[['mesa','Mesa'],['mapas','Mapas'],['combate','Combate'],['fichas','Fichas'],['mercador','Mercador'],['pistas','Pistas'],['diario','Diário'],['sussurros','Sussurros']];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const limite=n=>n<=2?2:n<=6?3:n<=12?4:5;
const custo=p=>p<=3?p:3+2*(p-3);
const vidaMax=S=>Math.max(1,20+3*((S.nivel||1)-1)+6*(S.pts?.vida||0)-5*(S.fome||0));
const chance=(S,k,mod)=>clamp(40+10*(S.pts?.[k]||0)+(mod||0)-5*(S.tormento||0),5,95);
const d=n=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n);}catch(e){return 1+Math.floor(Math.random()*n);}};
const hora=t=>{try{return new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
const dia=t=>{try{return new Date(t).toLocaleDateString('pt-BR');}catch(e){return '';}};
const uidGen=()=>Math.random().toString(36).slice(2,10);
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function fail(e){console.warn(e);toast(e&&e.code==='permission-denied'?'Sem permissão para mudar isso.':'Não deu para salvar. Confira a internet e tente de novo.');}

// ---------- estado ----------
let db=null,ERR='';
const ME={id:null,owner:false,name:''};
const st={bases:{},fichas:{},rolls:[],cena:null,combPub:null,combM:null,loja:null,diario:[],pistas:[],notas:[],mPistas:null,suss:{},rodLocal:[]};
let TAB='mesa'; try{TAB=localStorage.getItem('mesa-tab')||'mesa';}catch(e){}
let SEL=null, DIF=0, lastResult='', unread={};
const pend={};           // edições locais ainda não confirmadas, por "slug.campo"

function entries(){
  return SLUGS.map(slug=>{
    const f=Object.values(st.fichas).find(x=>x.slug===slug);
    return f?{slug,uid:f._id,data:f}:{slug,uid:null,data:st.bases[slug]};
  }).filter(e=>e.data);
}
const entryBy=slug=>entries().find(e=>e.slug===slug);
const myEntry=()=>entries().find(e=>e.uid&&e.uid===ME.id);
const canEdit=e=>ME.owner||(!!e.uid&&e.uid===ME.id);
const refOf=e=>e.uid?db.doc('fichas/'+e.uid):db.doc('personagens/'+e.slug);
function view(e){const S=Object.assign({},e.data);for(const k in pend){const [s,f]=k.split('.');if(s===e.slug)S[f]=pend[k];}return S;}
const saveT={};
function setField(e,field,val,delay){
  pend[e.slug+'.'+field]=val;
  clearTimeout(saveT[e.slug+field]);
  saveT[e.slug+field]=setTimeout(()=>{
    refOf(e).update({[field]:val}).then(()=>{delete pend[e.slug+'.'+field];}).catch(err=>{delete pend[e.slug+'.'+field];fail(err);render();});
  },delay??350);
}

// ---------- shell ----------
function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${TAB===k}">${n}${unread[k]&&TAB!==k?'<i class="dot"></i>':''}</button>`).join('');
}
function renderWho(){
  const e=myEntry();
  $('who').innerHTML=(ME.owner?`<span class="tag m">Mestre</span>`
    :e?`<span class="tag">Condenado</span><b>${esc(e.data.nome)}</b>`:`<b>Visitante</b>`)
    +(!db?'':ME.owner?`<button class="sm mbtn" data-mx="sair">Sair do modo Mestre</button>`:`<button class="sm mbtn" data-mx="entrar">Entrar como Mestre</button>`);
}
function render(){
  renderTabs();renderWho();
  const keep=captureFocus();
  const m=$('main');
  if(!db&&!TRIED){m.innerHTML='<p class="empty">Abrindo os portões…</p>';return;}
  if(!db){m.innerHTML=`<div class="panel gate"><h2>Sem conexão com a mesa</h2><p>Não deu para abrir a mesa. Confira a internet e recarregue a página.</p>${ERR?`<p class="hint">Detalhe: ${esc(ERR)}</p>`:''}</div>`;return;}
  if(TAB==='mapas'){m.innerHTML='';m.hidden=true;$('mapas').hidden=false;MAPAS.mostrar();FX.after();return;}
  m.hidden=false;$('mapas').hidden=true;
  ({mesa:rMesa,combate:rCombate,fichas:rFichas,mercador:rLoja,pistas:rPistas,diario:rDiario,sussurros:rSuss})[TAB]();
  restoreFocus(keep);
  FX.after();
}
function captureFocus(){const a=document.activeElement;if(!a||!a.id||!$('main').contains(a))return null;return{id:a.id,s:a.selectionStart,e:a.selectionEnd,v:a.value};}
function restoreFocus(k){if(!k)return;const el=$(k.id);if(!el)return;if(el.value!==k.v&&(el.tagName==='TEXTAREA'||el.type==='text'))el.value=k.v;el.focus();try{el.setSelectionRange(k.s,k.e);}catch(e){}}
let rT;function soon(){clearTimeout(rT);rT=setTimeout(render,30);}

// ---------- MESA ----------
function cenaHTML(){

async function postRoll(o){

  if(ME.owner&&OCULTA){o.oculta=true;FX.roll(o);st.rodLocal.unshift(o);st.rodLocal=st.rodLocal.slice(0,20);soon();return;}

function rollAttr(e,k,useB){
  const S=view(e), a=ATTRS.find(x=>x.k===k), c=chance(S,k,DIF);
  let r,r1,r2;
  if(useB){r1=d(100);r2=d(100);r=Math.min(r1,r2);const b=Object.assign({},S.bonus);b[k]=Math.max(0,(b[k]||0)-1);setField(e,'bonus',b,0);}
  else r=d(100);
  const res=r>=96?'crit':r<=Math.floor(c/5)?'exc':r<=c?'ok':'fail';
  const difName=DIFS.find(x=>x[1]===DIF)[0];
  const cls={exc:'r-exc',ok:'r-ok',fail:'r-fail',crit:'r-crit'}[res];
  const lbl={exc:'Sucesso excepcional',ok:'Sucesso',fail:'Falha',crit:'Falha crítica'}[res];
  lastResult=`<b class="big ${cls}">${r}</b><b class="${cls}">${lbl}</b><br><span class="hint">${a.n} · ${difName} · Chance ${c}%${useB?` · dados ${r1} e ${r2}`:''}</span>`;
  postRoll({quem:S.nome,uid:ME.id,attr:a.n,r,chance:c,res,dif:difName,bonus:!!useB,r1:r1||null,r2:r2||null});
  render();
}
function freeRoll(expr,quem){
  const m=String(expr).replace(/\s/g,'').toLowerCase().match(/^(\d{0,2})d(\d{1,3})([+-]\d{1,3})?$/);

function parsePreco(p){
  const s=String(p).toLowerCase();
  if(s.includes('grátis'))return{carne:0,dentes:0,ossos:0};
  if(/vida|memória|favor|tormento| ou |depende/.test(s))return null;
  const o={carne:0,dentes:0,ossos:0};let ok=false;
  s.replace(/(\d+)\s*de carne/g,(_,n)=>{o.carne+=+n;ok=true;});
  s.replace(/(\d+)\s*dentes?/g,(_,n)=>{o.dentes+=+n;ok=true;});
  s.replace(/(\d+)\s*ossos? de nobre/g,(_,n)=>{o.ossos+=+n;ok=true;});
  return ok?o:null;
}

function readImg(file,maxSide,maxLen,cb){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{let side=maxSide,q=.8,out;
    for(let k=0;k<8;k++){const s=Math.min(1,side/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<maxLen)break;q=Math.max(.45,q-.1);side=Math.round(side*.85);}
    cb(out);};img.src=rd.result;};
  rd.readAsDataURL(file);
}

// ---------- Firebase ----------
// Adaptador com a mesma interface do banco do claude.ai: doc/collection, orderBy, limit, onSnapshot, get, set, update, delete, add
const FB_CFG={
  apiKey:"AIzaSyCcoze3nO7qnq6GH6Cdv9iBJ52iExiIbzw",
  authDomain:"mesa-do-inferno.firebaseapp.com",
  projectId:"mesa-do-inferno",
  storageBucket:"mesa-do-inferno.firebasestorage.app",
  messagingSenderId:"356575570692",
  appId:"1:356575570692:web:1312cf052e698082833e51"};
const SDK='https://www.gstatic.com/firebasejs/12.6.0/';
let F=null,FS=null;
const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const wrapQuery=s=>({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty});
function fsDoc(p){const r=F.doc(FS,p);return{
  onSnapshot:(fn,err)=>F.onSnapshot(r,s=>fn(wrapDoc(s)),err),
  get:()=>F.getDoc(r).then(wrapDoc),
  set:(v,o)=>o?F.setDoc(r,v,o):F.setDoc(r,v),update:v=>F.updateDoc(r,v),delete:()=>F.deleteDoc(r)};}
function fsCol(p,cons=[]){const r=F.collection(FS,p),q=()=>cons.length?F.query(r,...cons):r;return{
  orderBy:(f,dir)=>fsCol(p,[...cons,F.orderBy(f,dir)]),
  limit:n=>fsCol(p,[...cons,F.limit(n)]),
  onSnapshot:(fn,err)=>F.onSnapshot(q(),s=>fn(wrapQuery(s)),err),
  get:()=>F.getDocs(q()).then(wrapQuery),
  add:v=>F.addDoc(r,v).then(x=>({id:x.id}))};}
async function conectar(){
  const [fApp,fAuth,fStore]=await Promise.all(['app','auth','firestore'].map(m=>import(SDK+'firebase-'+m+'.js')));
  F=fStore;
  const app=fApp.initializeApp(FB_CFG);
  FS=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  const auth=fAuth.getAuth(app);
  // login anônimo: o Firebase guarda a sessão no navegador, então o uid se mantém entre visitas
  const u=await new Promise((ok,no)=>{const off=fAuth.onAuthStateChanged(auth,x=>{off();ok(x);},no);});
  ME.id=(u||(await fAuth.signInAnonymously(auth)).user).uid;
  try{localStorage.setItem('mesa-uid',ME.id);}catch(e){}
  db={doc:fsDoc,collection:p=>fsCol(p)};
  try{ME.owner=(await db.doc('mestres/'+ME.id).get()).exists;}catch(e){ME.owner=false;}
}

// ---------- Mestre ----------
// SHA-256 da senha. As regras do Firestore conferem outro hash, que não fica neste arquivo.
const MESTRE_HASH='87373194136ff54adc0e72f0e35d62de2128674f208c210a66faff1eb47a027f';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-mx]'); if(!t||!db) return;
  if(t.dataset.mx==='entrar'){$('mlogin').hidden=false;$('merr').hidden=true;$('msenha').value='';$('msenha').focus();return;}
  if(t.dataset.mx==='cancel'){$('mlogin').hidden=true;return;}
  if(t.dataset.mx==='sair'){db.doc('mestres/'+ME.id).delete().then(()=>location.reload()).catch(fail);}
});
$('mlogin').addEventListener('submit',async ev=>{
  ev.preventDefault(); const err=$('merr'), senha=$('msenha').value;
  try{
    if(await sha256(senha)===MESTRE_HASH){await db.doc('mestres/'+ME.id).set({h:await sha256('mestre:'+senha),t:Date.now()});location.reload();return;}
    err.textContent='Senha errada.';
  }catch(e){console.warn(e);err.textContent=e?.code==='permission-denied'?'As regras do Firestore recusaram a entrada.':'Não deu para entrar: '+(e?.code||e?.message);}
  err.hidden=false;
});
async function semear(){
  try{const s=await db.collection('personagens').get();if(s.size)return;
    const seeds=JSON.parse($('seeds').textContent);
    await Promise.all(Object.entries(seeds).map(([slug,v])=>db.doc('personagens/'+slug).set(v)));
    toast('Personagens iniciais gravados.');}catch(e){fail(e);}
}

// ---------- conexão ----------
function sub(q,fn){q.onSnapshot(fn,err=>console.warn('sub',err));}
function docs(s){return s.docs.map(x=>Object.assign({_id:x.id},x.data()));}
function mark(tab){if(TAB!==tab){unread[tab]=true;renderTabs();}}
let ready={}, TRIED=false;
async function start(){
  try{await conectar();}catch(e){console.warn(e);db=null;ERR=e?.code||e?.message||String(e);}
  TRIED=true;
  if(!db){render();return;}
  sub(db.collection('personagens'),s=>{st.bases={};docs(s).forEach(x=>st.bases[x._id]=x);soon();});
  sub(db.collection('fichas'),s=>{st.fichas={};docs(s).forEach(x=>st.fichas[x._id]=x);watchSuss();soon();});
  sub(db.collection('rolagens').orderBy('t','desc').limit(40),s=>{const vistas=new Set(st.rolls.map(x=>x._id));st.rolls=docs(s);if(ready.r){mark('mesa');st.rolls.filter(x=>!vistas.has(x._id)).forEach(FX.roll);}ready.r=1;soon();});
  sub(db.doc('publico/cena'),s=>{const old=st.cena?.t;st.cena=s.exists?s.data():null;if(ready.c&&st.cena&&st.cena.t!==old&&(st.cena.titulo||st.cena.texto||st.cena.img)){if(!ME.owner)toast('O Mestre revelou uma cena.');mark('mesa');setTimeout(()=>$('cenabox')?.classList.add('flash'),60);}ready.c=1;soon();});
  sub(db.doc('publico/combate'),s=>{const was=st.combPub?.ativo;st.combPub=s.exists?s.data():null;if(ready.k&&st.combPub?.ativo&&!was){if(!ME.owner)toast('Combate!');mark('combate');}ready.k=1;soon();});
  sub(db.doc('publico/loja'),s=>{const was=st.loja?.aberto;st.loja=s.exists?s.data():null;if(ready.l&&st.loja?.aberto&&!was){if(!ME.owner)toast('O Mercador abriu a banca.');mark('mercador');}ready.l=1;soon();});
  sub(db.collection('diario').orderBy('t','desc').limit(100),s=>{st.diario=docs(s);if(ready.d)mark('diario');ready.d=1;soon();});
  sub(db.collection('pistas').orderBy('t','desc').limit(100),s=>{const n=s.size>st.pistas.length;st.pistas=docs(s);if(ready.p&&n){if(!ME.owner)toast('Nova pista no quadro.');mark('pistas');}ready.p=1;soon();});
  sub(db.collection('notas').orderBy('t','asc').limit(500),s=>{st.notas=docs(s);soon();});
  if(ME.owner){
    sub(db.doc('mestre/combate'),s=>{st.combM=s.exists?s.data():null;soon();});
    sub(db.doc('mestre/pistas'),s=>{st.mPistas=s.exists?s.data():null;soon();});
    semear();
  }
  MAPAS.iniciar();
  render();
}
const subbed=new Set();
function watchSuss(){
  const ids=ME.owner?Object.keys(st.fichas):(ME.id?[ME.id]:[]);
  ids.forEach(id=>{if(subbed.has(id))return;subbed.add(id);let first=true;
    sub(db.collection('sussurros/'+id+'/msgs').orderBy('t','desc').limit(50),s=>{const n=s.size>(st.suss[id]||[]).length;st.suss[id]=docs(s);
      if(!first&&n&&!ME.owner){toast('Você ouviu um sussurro…');mark('sussurros');FX.sussurro(st.suss[id][0]?.texto);}first=false;soon();});});
}
// ponte para a aba Mapas (mapas.js)
window.MESA={get db(){return db;},ME,st,DATA,entries,entryBy,view,vidaMax,combM,saveComb,uidGen,toast,fail};
render();
start();
})();
